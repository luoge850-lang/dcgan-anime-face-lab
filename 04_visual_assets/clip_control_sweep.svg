<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1240 520">
<title id="title">CLIP controlled continuation sweep</title>
<desc id="desc">Side-by-side bars compare legacy FID and CLIP feature MMD squared for an evaluation control, a no-CLIP continuation control, and four CLIP regularization strengths.</desc>
