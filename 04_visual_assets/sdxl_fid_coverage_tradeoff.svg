<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">SDXL replacement ratio: FID and feature coverage</title>
  <desc id="desc">A0 through A50 move toward higher FID and lower coverage as the SDXL replacement ratio increases.</desc>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17202a">SDXL replacement trade-off</text>
  <text x="450" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#566573">Same Exp11 checkpoint · 4K fine-tuning pool · 100 epochs · seed 42</text>

  <rect x="86" y="70" width="746" height="350" fill="#fbfcfc" stroke="#d5d8dc"/>
  <line x1="86" y1="131" x2="832" y2="131" stroke="#2c7bb6" stroke-width="1.5" stroke-dasharray="7 5"/>
  <line x1="86" y1="169" x2="832" y2="169" stroke="#e67b3c" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="86" y1="203" x2="832" y2="203" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="2 5"/>
  <text x="826" y="126" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#2c7bb6">A0 coverage = 0.6687</text>
  <text x="826" y="164" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#c26d31">95% warning</text>
  <text x="826" y="198" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#a93226">90% abort</text>

  <line x1="86" y1="420" x2="832" y2="420" stroke="#2c3e50" stroke-width="1.5"/>
  <line x1="86" y1="70" x2="86" y2="420" stroke="#2c3e50" stroke-width="1.5"/>
  <g font-family="Arial, sans-serif" font-size="11" fill="#34495e">
    <text x="86" y="442" text-anchor="middle">36</text>
    <text x="273" y="442" text-anchor="middle">40</text>
    <text x="459" y="442" text-anchor="middle">44</text>
    <text x="646" y="442" text-anchor="middle">48</text>
    <text x="832" y="442" text-anchor="middle">52</text>
    <text x="459" y="470" text-anchor="middle" font-size="13" font-weight="700">Legacy FID (lower is better)</text>
    <text transform="translate(24,245) rotate(-90)" text-anchor="middle" font-size="13" font-weight="700">Coverage (higher is better)</text>
    <text x="74" y="424" text-anchor="end">0.40</text>
    <text x="74" y="307" text-anchor="end">0.50</text>
    <text x="74" y="190" text-anchor="end">0.60</text>
    <text x="74" y="73" text-anchor="end">0.70</text>
  </g>

  <polyline points="175,107 179,126 346,175 501,255 739,374" fill="none" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="6 4"/>
  <g stroke="#ffffff" stroke-width="2">
    <circle cx="175" cy="107" r="9" fill="#2c7bb6"/>
    <circle cx="179" cy="126" r="9" fill="#5aaec4"/>
    <circle cx="346" cy="175" r="9" fill="#d3a83c"/>
    <circle cx="501" cy="255" r="9" fill="#e07b3c"/>
    <circle cx="739" cy="374" r="9" fill="#c0392b"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700">
    <text x="160" y="94" fill="#2c7bb6">A0  37.91 / .6687</text>
    <text x="190" y="119" fill="#3b8ca5">A10  37.99 / .6525</text>
    <text x="356" y="166" fill="#9a7418">A20  41.58 / .6108</text>
    <text x="511" y="247" fill="#c35f2b">A30  44.92 / .5423</text>
    <text x="622" y="393" fill="#a93226">A50  49.94 / .4397</text>
  </g>
  <text x="450" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#566573">More SDXL replacement →</text>
  <text x="450" y="488" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Within-study diagnostic; not a standardized cross-dataset benchmark</text>
</svg>
