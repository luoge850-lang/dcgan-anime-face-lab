<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Dynamic Batching 资源监控范围</title>
  <desc id="desc">104 个五秒监控样本的 GPU 显存、SM 利用率和 RSS 观测范围。</desc>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" fill="#222">资源监控观测范围（104 个样本）</text>
  <text x="450" y="505" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" fill="#222">监控指标</text>
  <text x="20" y="255" text-anchor="middle" transform="rotate(-90 20 255)" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" fill="#222">归一化观测范围</text>
  <g stroke="#dddddd" stroke-width="1"><line x1="230" y1="90" x2="230" y2="430"/><line x1="380" y1="90" x2="380" y2="430"/><line x1="530" y1="90" x2="530" y2="430"/><line x1="680" y1="90" x2="680" y2="430"/></g>
  <g font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#444" text-anchor="middle"><text x="230" y="455">0</text><text x="380" y="455">25%</text><text x="530" y="455">50%</text><text x="680" y="455">75%</text><text x="830" y="455">100%</text></g>
  <g font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#222"><text x="110" y="150">GPU 显存</text><text x="110" y="265">SM 利用率</text><text x="110" y="380">RSS</text></g>
  <line x1="830" y1="140" x2="830" y2="160" stroke="#2f6fbd" stroke-width="8"/><line x1="830" y1="150" x2="830" y2="150" stroke="#2f6fbd" stroke-width="14"/>
  <line x1="230" y1="255" x2="350" y2="255" stroke="#d9772b" stroke-width="8"/><line x1="230" y1="245" x2="230" y2="265" stroke="#d9772b" stroke-width="3"/><line x1="350" y1="245" x2="350" y2="265" stroke="#d9772b" stroke-width="3"/>
  <line x1="230" y1="370" x2="237" y2="370" stroke="#2d8a57" stroke-width="8"/><line x1="230" y1="360" x2="230" y2="380" stroke="#2d8a57" stroke-width="3"/><line x1="237" y1="360" x2="237" y2="380" stroke="#2d8a57" stroke-width="3"/>
  <g font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#222"><text x="840" y="155">677.19 MB（恒定）</text><text x="365" y="260">0～4%</text><text x="250" y="375">1084.06～1089.45 MB</text></g>
</svg>
