groups:
- name: dcgan
  rules:
  - alert: DCGANQueueBacklog
    expr: dcgan_inference_queue_depth > 50
    for: 30s
    labels:
      severity: warning
  - alert: DCGANHighP99Latency
    expr: histogram_quantile(0.99, sum(rate(dcgan_http_request_latency_seconds_bucket[1m])) by (le)) > 0.2
    for: 30s
    labels:
      severity: critical
